name: Publish nauvim-core

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Merged nauvim-core PR number
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-nauvim-core

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - name: Resolve the merged commit
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Expected a pull request number." >&2
            exit 1
          fi

          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          if ! sha=$(jq -er 'select(.merged and .base.ref == "main") | .merge_commit_sha' <<< "$pr"); then
            echo "PR #$PR_NUMBER must be merged into main." >&2
            exit 1
          fi

          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq '.status')
          if [[ "$status" != ahead && "$status" != identical ]]; then
            echo "Commit $sha is no longer part of main." >&2
            exit 1
          fi

          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Check the crate version on crates.io
        id: version
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "nauvim-core") | .version')
          entry=$(curl --fail --silent --show-error --retry 3 \
            "https://index.crates.io/na/uv/nauvim-core" |
            jq -sc --arg version "$version" 'map(select(.vers == $version)) | first // null')

          if [[ "$entry" == null ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          package="nauvim-core-$version"
          if ! jq -e '.yanked == false' <<< "$entry" > /dev/null ||
              ! curl --fail --silent --show-error --retry 3 \
                "https://static.crates.io/crates/nauvim-core/$package.crate" |
                tar -xzO "$package/.cargo_vcs_info.json" |
                jq -e --arg sha "$RELEASE_SHA" '
                  .git.sha1 == $sha and (.git.dirty != true)
                ' > /dev/null; then
            echo "Published $package is yanked or could not be verified against $RELEASE_SHA." >&2
            exit 1
          fi
          echo "$package is already published from $RELEASE_SHA."

      - name: Authenticate with crates.io
        if: steps.version.outputs.needed == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish the crate
        if: steps.version.outputs.needed == 'true'
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --registry crates-io
