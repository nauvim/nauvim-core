[package]
name = "nauvim-core"
version = "0.5.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "UI-independent Nauvim session and plugin engine"
repository = "https://github.com/nauvim/nauvim-core"
documentation = "https://docs.rs/nauvim-core"
readme = "README.md"
keywords = ["neovim", "nauvim", "rpc", "ssh"]
categories = ["api-bindings", "asynchronous", "text-editors"]

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[features]
default = [
    "ssh",
    "plugin-local-forward",
    "plugin-filesystem",
    "plugin-http",
    "plugin-clipboard",
]
ssh = ["dep:openrussh-client", "dep:russh-sftp"]
plugin-local-forward = []
plugin-filesystem = []
plugin-http = [
    "dep:bytes",
    "dep:hyper",
    "dep:hyper-util",
    "dep:tokio-rustls",
    "dep:rcgen",
]
plugin-clipboard = []

[dependencies]
nvim-rpc-plugin = "0.2"
nvim-rpc-ui = "0.1.4"
mlua = { version = "0.11", features = ["lua54", "vendored", "send"] }
directories = "6"
libc = "0.2"
tempfile = "3"
tokio = { version = "1", features = [
    "rt",
    "macros",
    "net",
    "process",
    "io-util",
    "sync",
    "time",
    "signal",
    "fs",
] }
tokio-util = { version = "0.7", features = ["rt"] }
bytes = { version = "1", optional = true }
getrandom = "0.3"
url = "2"
openrussh-client = { version = "0.4.6", optional = true, default-features = false, features = [
    "ring",
    "rsa",
    "config-parser",
    "known-hosts",
    "process",
    "local-tcp-forwarding",
    "local-stream-forwarding",
] }
russh-sftp = { version = "2.4", optional = true }
hyper = { version = "1", optional = true, features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", optional = true, features = ["tokio"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
hyper = { version = "1", features = ["client", "http1", "http2"] }
http-body-util = "0.1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

